<!-- @dsCard group="Type" viewport="700x160" name="Weights" subtitle="300–700; display never goes below 500" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }
  
</style></head>
<body>
<div class="row" style="gap:26px">
    <div class="col" style="gap:2px"><span style="font:300 34px/1 var(--font-sans);letter-spacing:-0.02em">Aa</span><span class="lbl">300 light</span></div>
    <div class="col" style="gap:2px"><span style="font:400 34px/1 var(--font-sans);letter-spacing:-0.02em">Aa</span><span class="lbl">400 regular</span></div>
    <div class="col" style="gap:2px"><span style="font:500 34px/1 var(--font-sans);letter-spacing:-0.02em">Aa</span><span class="lbl">500 medium</span></div>
    <div class="col" style="gap:2px"><span style="font:600 34px/1 var(--font-sans);letter-spacing:-0.02em">Aa</span><span class="lbl">600 semibold</span></div>
    <div class="col" style="gap:2px"><span style="font:700 34px/1 var(--font-sans);letter-spacing:-0.02em">Aa</span><span class="lbl">700 bold · rare</span></div>
  </div>
</body></html>
