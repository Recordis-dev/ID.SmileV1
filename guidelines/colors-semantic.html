<!-- @dsCard group="Colors" viewport="700x170" name="Status" subtitle="Rare, never decorative" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }
  
</style></head>
<body>
<div class="row">
    <div class="sw col" style="gap:6px"><div class="chip" style="background:#0E8A4F"></div><div class="lbl">positive</div><div class="lbl" style="color:var(--text-secondary)">#0E8A4F</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#B5670A"></div><div class="lbl">caution</div><div class="lbl" style="color:var(--text-secondary)">#B5670A</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#D0342C"></div><div class="lbl">critical</div><div class="lbl" style="color:var(--text-secondary)">#D0342C</div></div>
    <div class="sw col" style="gap:6px"><div class="chip" style="background:#E8F5EE"></div><div class="lbl">positive-soft</div><div class="lbl" style="color:var(--text-secondary)">#E8F5EE</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#FBF1E4"></div><div class="lbl">caution-soft</div><div class="lbl" style="color:var(--text-secondary)">#FBF1E4</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#FBEBEA"></div><div class="lbl">critical-soft</div><div class="lbl" style="color:var(--text-secondary)">#FBEBEA</div></div>
  </div>
</body></html>
