<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="../tokens/remix.css">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&display=swap" rel="stylesheet">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-start; }
  .col { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: .02em; color: var(--text-tertiary); }
  .chip { width: 92px; height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }
  .kicker { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--editorial); display: flex; align-items: center; gap: 10px; }
  .kicker i { width: 26px; height: 1px; background: var(--editorial); display: block; }
  h2 { font-family: var(--font-display); font-weight: var(--weight-display); font-size: 34px; line-height: 1.05; letter-spacing: -.03em; margin: 10px 0 0; color: var(--text-primary); }
</style></head>
<body>
<div class="row">
  <div class="col"><div class="chip" style="background:#2E9AA0"></div><div class="lbl">accent</div></div>
  <div class="col"><div class="chip" style="background:#37B4BA"></div><div class="lbl">accent-hover</div></div>
  <div class="col"><div class="chip" style="background:#0E5C63"></div><div class="lbl">accent-press</div></div>
  <div class="col"><div class="chip" style="background:#D2506B"></div><div class="lbl">editorial</div></div>
  <div class="col" style="margin-left:12px;gap:0">
    <div class="kicker"><i></i>Editorial kicker</div>
    <h2>Display stays Bricolage.</h2>
    <div class="lbl" style="margin-top:10px">body, UI and specs stay Aperture</div>
  </div>
</div>
</body></html>
