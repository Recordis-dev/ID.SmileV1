<!-- @dsCard group="Surfaces" viewport="700x170" name="Radii" subtitle="8 12 18 28 42 and the 980px pill" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }
  
</style></head>
<body>
<div class="row" style="gap:16px">
    <div class="col" style="gap:6px"><div style="width:88px;height:66px;background:var(--mist);border-radius:8px"></div><span class="lbl">sm 8px</span></div><div class="col" style="gap:6px"><div style="width:88px;height:66px;background:var(--mist);border-radius:12px"></div><span class="lbl">md 12px</span></div><div class="col" style="gap:6px"><div style="width:88px;height:66px;background:var(--mist);border-radius:18px"></div><span class="lbl">lg 18px</span></div><div class="col" style="gap:6px"><div style="width:88px;height:66px;background:var(--mist);border-radius:28px"></div><span class="lbl">xl 28px</span></div><div class="col" style="gap:6px"><div style="width:88px;height:66px;background:var(--mist);border-radius:42px"></div><span class="lbl">2xl 42px</span></div>
    <div class="col" style="gap:6px"><div style="width:88px;height:44px;background:var(--ink-900);border-radius:980px"></div><span class="lbl">pill 980px</span></div>
  </div>
</body></html>
