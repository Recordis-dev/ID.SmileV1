<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }
  
</style></head>
<body>
<div class="row" style="gap:40px;align-items:flex-end">
    <span style="font:var(--weight-semibold) 40px/1 var(--font-sans);letter-spacing:-0.03em">Aperture</span>
    <span style="font:var(--weight-semibold) 20px/1 var(--font-sans);letter-spacing:-0.02em">Aperture</span>
    <span style="font:var(--weight-semibold) 13px/1 var(--font-sans);letter-spacing:-0.01em">Aperture</span>
    <span class="lbl" style="max-width:180px">Semibold, tight tracking, ink-900 on light or white on void. Never outlined, never coloured.</span>
  </div>
</body></html>
