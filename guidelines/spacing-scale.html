<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }

</style></head>
<body>
<div class="row" style="align-items:flex-end;gap:10px">
    <div class="col" style="gap:6px;align-items:flex-start"><div style="width:4px;height:22px;background:var(--ink-900);border-radius:3px"></div><span class="lbl">1 4px</span></div><div class="col" style="gap:6px;align-items:flex-start"><div style="width:8px;height:22px;background:var(--ink-900);border-radius:3px"></div><span class="lbl">2 8px</span></div><div class="col" style="gap:6px;align-items:flex-start"><div style="width:12px;height:22px;background:var(--ink-900);border-radius:3px"></div><span class="lbl">3 12px</span></div><div class="col" style="gap:6px;align-items:flex-start"><div style="width:16px;height:22px;background:var(--ink-900);border-radius:3px"></div><span class="lbl">4 16px</span></div><div class="col" style="gap:6px;align-items:flex-start"><div style="width:22px;height:22px;background:var(--ink-900);border-radius:3px"></div><span class="lbl">5 22px</span></div><div class="col" style="gap:6px;align-items:flex-start"><div style="width:32px;height:22px;background:var(--ink-900);border-radius:3px"></div><span class="lbl">6 32px</span></div><div class="col" style="gap:6px;align-items:flex-start"><div style="width:44px;height:22px;background:var(--ink-900);border-radius:3px"></div><span class="lbl">7 44px</span></div><div class="col" style="gap:6px;align-items:flex-start"><div style="width:60px;height:22px;background:var(--ink-900);border-radius:3px"></div><span class="lbl">8 60px</span></div>
  </div>
</body></html>
