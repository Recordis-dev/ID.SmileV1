<!-- @dsCard group="Type" viewport="700x160" name="Spec mono" subtitle="IBM Plex Mono for measurements and part numbers" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }

</style></head>
<body>
<div class="row" style="gap:32px">
    <div class="col" style="gap:2px"><span style="font:var(--text-spec)">142 g</span><span class="lbl">weight</span></div>
    <div class="col" style="gap:2px"><span style="font:var(--text-spec)">40 mm</span><span class="lbl">driver</span></div>
    <div class="col" style="gap:2px"><span style="font:var(--text-spec)">A2XKQ-04</span><span class="lbl">part no.</span></div>
    <div class="col" style="gap:2px"><span style="font:var(--text-spec)">USB-C · 3.5 mm</span><span class="lbl">ports</span></div>
  </div>
</body></html>
