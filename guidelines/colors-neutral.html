<!-- @dsCard group="Colors" viewport="700x170" name="Paper scale" subtitle="Five near-whites carry every light surface" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }
  
</style></head>
<body>
<div class="row">
    <div class="sw col" style="gap:6px"><div class="chip" style="background:#FFFFFF"></div><div class="lbl">white</div><div class="lbl" style="color:var(--text-secondary)">#FFFFFF</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#FAFBFC"></div><div class="lbl">snow</div><div class="lbl" style="color:var(--text-secondary)">#FAFBFC</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#F2F4F6"></div><div class="lbl">mist</div><div class="lbl" style="color:var(--text-secondary)">#F2F4F6</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#E7EAEE"></div><div class="lbl">fog</div><div class="lbl" style="color:var(--text-secondary)">#E7EAEE</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#DCDFE3"></div><div class="lbl">line</div><div class="lbl" style="color:var(--text-secondary)">#DCDFE3</div></div>
  </div>
</body></html>
