<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }
  
</style></head>
<body>
<div class="row" style="gap:18px;padding:8px">
    <div class="col" style="gap:8px"><div style="width:132px;height:92px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-inset-hairline)"></div><span class="lbl">hairline</span></div><div class="col" style="gap:8px"><div style="width:132px;height:92px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card)"></div><span class="lbl">card</span></div><div class="col" style="gap:8px"><div style="width:132px;height:92px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-raise)"></div><span class="lbl">raise</span></div><div class="col" style="gap:8px"><div style="width:132px;height:92px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-modal)"></div><span class="lbl">modal</span></div>
  </div>
</body></html>
