<!-- @dsCard group="Colors" viewport="700x170" name="Dark stage" subtitle="Cinematic sections sit on void, cards on graphite" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }

</style></head>
<body>
<div class="row" style="background:var(--void);margin:-22px;padding:22px;height:126px">
    <div class="sw col" style="gap:6px"><div class="chip" style="background:#08090B"></div><div class="lbl">void</div><div class="lbl" style="color:var(--text-secondary)">#08090B</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#14161A"></div><div class="lbl">graphite</div><div class="lbl" style="color:var(--text-secondary)">#14161A</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#1E2126"></div><div class="lbl">slate</div><div class="lbl" style="color:var(--text-secondary)">#1E2126</div></div>
    <div class="col" style="gap:4px;margin-left:12px">
      <span style="font:var(--weight-semibold) 24px/1.1 var(--font-sans);letter-spacing:var(--tracking-tight);color:#fff">White on void</span>
      <span style="font:var(--text-small);color:#A8AEB6">Secondary copy at #A8AEB6</span>
    </div>
  </div>
</body></html>
