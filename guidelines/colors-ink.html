<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 22px; background: var(--surface-page); }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); letter-spacing: 0.02em; color: var(--text-tertiary); }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: var(--radius-sm); box-shadow: var(--shadow-inset-hairline); }

</style></head>
<body>
<div class="row">
    <div class="sw col" style="gap:6px"><div class="chip" style="background:#9AA1A9"></div><div class="lbl">ink-400</div><div class="lbl" style="color:var(--text-secondary)">#9AA1A9</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#7C838C"></div><div class="lbl">ink-500</div><div class="lbl" style="color:var(--text-secondary)">#7C838C</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#5A6169"></div><div class="lbl">ink-600</div><div class="lbl" style="color:var(--text-secondary)">#5A6169</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#3C4248"></div><div class="lbl">ink-700</div><div class="lbl" style="color:var(--text-secondary)">#3C4248</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#22262B"></div><div class="lbl">ink-800</div><div class="lbl" style="color:var(--text-secondary)">#22262B</div></div><div class="sw col" style="gap:6px"><div class="chip" style="background:#121417"></div><div class="lbl">ink-900</div><div class="lbl" style="color:var(--text-secondary)">#121417</div></div>
  </div>
</body></html>
