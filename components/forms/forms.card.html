<!-- @dsCard group="Components" viewport="700x330" name="Forms — input, select, checkbox, radio, switch" subtitle="44px controls, 12px radius, 2px accent focus ring" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../jsx-loader.js"></script>
<style>
  body { padding: 22px; background: var(--surface-page); }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); color: var(--text-tertiary); }
</style></head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo">
function Demo() {
  const [v, setV] = React.useState("");
  const [chk, setChk] = React.useState(true);
  const [ship, setShip] = React.useState("Standard");
  const [on, setOn] = React.useState(true);
  return (
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 22 }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <Input label="Email" placeholder="you@studio.com" value={v} onChange={e => setV(e.target.value)} hint="Used for order updates" />
        <Input label="Search" icon="search" placeholder="Search Aperture" />
        <Input label="Card number" error="Check this number" defaultValue="4242 4242" />
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <Select label="Finish" options={["Graphite", "Silver", "Bone"]} />
        <Checkbox checked={chk} onChange={() => setChk(!chk)} label="Add engraving" description="Free, adds one day" />
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {["Standard", "Express"].map(s => (
            <Radio key={s} name="ship" checked={ship === s} onChange={() => setShip(s)} label={s}
              description={s === "Standard" ? "Free, 3-5 days" : "$12, tomorrow"} />
          ))}
        </div>
        <Switch checked={on} onChange={() => setOn(!on)} label="Spatial audio" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
<script>
  ApertureLoad(["../core/Icon.jsx","Input.jsx","Select.jsx","Checkbox.jsx","Radio.jsx","Switch.jsx"]).then(function () {
    var code = document.getElementById("demo").textContent;
    (0, eval)(Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code);
  });
</script>
</body></html>
