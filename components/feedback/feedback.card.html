<!-- @dsCard group="Components" viewport="700x300" name="Feedback — dialog, toast, tooltip" subtitle="Blurred-scrim modal, ink toast pill, hover label" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../jsx-loader.js"></script>
<style>
  body { padding: 22px; background: var(--surface-page); }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); color: var(--text-tertiary); }
</style></head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo">
function Demo() {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap" }}>
        <Button variant="outline" onClick={() => setOpen(true)}>Open dialog</Button>
        <Tooltip label="Search"><span style={{ padding: 8, borderRadius: 999, boxShadow: "var(--shadow-inset-hairline)", display: "inline-flex" }}><Icon name="search" size={16} /></span></Tooltip>
        <Tooltip label="Your bag" placement="right"><span style={{ padding: 8, borderRadius: 999, boxShadow: "var(--shadow-inset-hairline)", display: "inline-flex" }}><Icon name="shopping-bag" size={16} /></span></Tooltip>
      </div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
        <Toast tone="positive" icon="check" message="Added to bag" />
        <Toast message="Saved for later" onDismiss={() => {}} />
        <Toast tone="critical" icon="triangle-alert" message="Payment declined" />
      </div>
      <div style={{ position: "relative", height: 96, borderRadius: 12, overflow: "hidden", boxShadow: "var(--shadow-inset-hairline)" }}>
        <span style={{ position: "absolute", left: 16, top: 16, font: "var(--text-small)", color: "var(--text-tertiary)" }}>dialog renders over the page scrim</span>
      </div>
      <Dialog open={open} title="Remove from bag?" description="You can add it back at any time."
        onClose={() => setOpen(false)}
        actions={<><Button variant="secondary" onClick={() => setOpen(false)}>Keep</Button><Button onClick={() => setOpen(false)}>Remove</Button></>} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
<script>
  ApertureLoad(["../core/Icon.jsx","../core/Button.jsx","Dialog.jsx","Toast.jsx","Tooltip.jsx"]).then(function () {
    var code = document.getElementById("demo").textContent;
    (0, eval)(Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code);
  });
</script>
</body></html>
