<!-- @dsCard group="Components" viewport="700x300" name="Navigation — nav, tabs" subtitle="Translucent 48px bar; underline and segmented tabs" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../jsx-loader.js"></script>
<style>
  body { padding: 22px; background: var(--surface-page); }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); color: var(--text-tertiary); }
</style></head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo">
function Demo() {
  const [page, setPage] = React.useState("Halo");
  const [tab, setTab] = React.useState("Overview");
  const [mode, setMode] = React.useState("Buy");
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={{ borderRadius: 12, overflow: "hidden", boxShadow: "var(--shadow-inset-hairline)" }}>
        <Nav brand="Aperture" items={["Halo", "Studio", "Support"]} active={page} onSelect={setPage}
          actions={<><Icon name="search" size={16} /><Icon name="shopping-bag" size={16} /></>} style={{ position: "static" }} />
        <div style={{ height: 34, background: "var(--snow)" }}></div>
      </div>
      <div style={{ borderRadius: 12, overflow: "hidden", background: "linear-gradient(120deg,#16181B,#2A2F36)" }}>
        <Nav tone="dark" brand="Aperture" items={["Halo", "Studio", "Support"]} active={page} onSelect={setPage}
          actions={<><Icon name="search" size={16} /><Icon name="shopping-bag" size={16} /></>} style={{ position: "static" }} />
        <div style={{ height: 34 }}></div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 32, flexWrap: "wrap" }}>
        <Tabs items={["Overview", "Specs", "Compare"]} active={tab} onSelect={setTab} />
        <Tabs variant="segmented" items={["Buy", "Lease"]} active={mode} onSelect={setMode} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
<script>
  ApertureLoad(["../core/Icon.jsx","Nav.jsx","Tabs.jsx"]).then(function () {
    var code = document.getElementById("demo").textContent;
    (0, eval)(Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code);
  });
</script>
</body></html>
