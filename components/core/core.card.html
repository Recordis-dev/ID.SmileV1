<!-- @dsCard group="Components" viewport="700x300" name="Core — buttons, badges, tags, cards" subtitle="Pill buttons in five skins, status pills, chips, card tones" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../jsx-loader.js"></script>
<style>
  body { padding: 22px; background: var(--surface-page); }
  .lbl { font: var(--weight-medium) var(--size-micro)/1 var(--font-mono); color: var(--text-tertiary); }
</style></head>
<body>
<div id="root"></div>
<script type="text/plain" id="demo">
function Demo() {
  const [sel, setSel] = React.useState("256 GB");
  const row = { display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" };
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={row}>
        <Button>Buy</Button>
        <Button variant="secondary">Add to bag</Button>
        <Button variant="outline">Compare</Button>
        <Button variant="ghost" iconRight="chevron-right">Learn more</Button>
        <Button disabled>Sold out</Button>
      </div>
      <div style={row}>
        <Button size="sm">Small</Button>
        <Button size="md" icon="shopping-bag">Medium</Button>
        <Button size="lg">Large</Button>
        <span style={{ background: "var(--void)", padding: "10px 14px", borderRadius: 999 }}><Button variant="inverse">Inverse</Button></span>
      </div>
      <div style={row}>
        <Badge tone="accent">New</Badge>
        <Badge tone="positive">In stock</Badge>
        <Badge tone="caution">Backordered</Badge>
        <Badge>Refurbished</Badge>
        {["128 GB", "256 GB", "512 GB"].map(t => <Tag key={t} selected={sel === t} onClick={() => setSel(t)}>{t}</Tag>)}
        <Tag onRemove={() => {}}>Titanium</Tag>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12 }}>
        {[["light","Light"],["subtle","Subtle"],["hairline","Hairline"],["dark","Dark"]].map(([tone,l]) => (
          <Card key={tone} tone={tone} padding="16px" radius="var(--radius-lg)" interactive style={{ height: 74 }}>
            <span style={{ font: "var(--weight-medium) var(--size-body-sm)/1 var(--font-sans)" }}>{l}</span>
          </Card>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
<script>
  ApertureLoad(["Icon.jsx","Button.jsx","Badge.jsx","Tag.jsx","Card.jsx"]).then(function () {
    var code = document.getElementById("demo").textContent;
    (0, eval)(Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code);
  });
</script>
</body></html>
