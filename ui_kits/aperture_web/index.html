<!-- @dsCard group="Aperture Web" viewport="1280x720" name="Aperture web store" subtitle="Click-through storefront: home, product, compare, bag" -->
<!-- @startingPoint section="Web" subtitle="Premium storefront: hero, product, compare, bag" viewport="1280x900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aperture — web kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../jsx-loader.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/plain" id="app">
function App() {
  const [page, setPage] = React.useState("Store");
  const [bag, setBag] = React.useState([]);
  const [toast, setToast] = React.useState(null);

  React.useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), 3200);
    return () => clearTimeout(t);
  }, [toast]);

  function add(label) {
    setBag((b) => b.concat([label]));
    setToast("Added to bag");
  }

  return (
    <div>
      <Nav
        brand="Aperture"
        items={["Store", "Halo", "Compare", "Support"]}
        tone={page === "Store" ? "dark" : "light"}
        active={page}
        onSelect={setPage}
        actions={<>
          <Tooltip label="Search"><Icon name="search" size={16} /></Tooltip>
          <Tooltip label={bag.length ? bag.length + " in bag" : "Your bag"} placement="left">
            <span onClick={() => setPage("Bag")} style={{ cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 5 }}>
              <Icon name="shopping-bag" size={16} />
              {bag.length ? <span style={{ font: "var(--weight-medium) var(--size-micro)/1 var(--font-sans)" }}>{bag.length}</span> : null}
            </span>
          </Tooltip>
        </>}
      />
      {page === "Store" ? <Home onNavigate={setPage} /> : null}
      {page === "Halo" ? <Product onAdd={add} onNavigate={setPage} /> : null}
      {page === "Compare" ? <Compare onNavigate={setPage} /> : null}
      {page === "Bag" ? <Bag items={bag} onNavigate={setPage} onRemove={(i) => setBag((b) => b.filter((_, k) => k !== i))} /> : null}
      {page === "Support" ? (
        <Section tone="light" width="var(--container-narrow)">
          <Eyebrow>Support</Eyebrow>
          <h1 style={{ font: "var(--text-h1)", letterSpacing: "var(--tracking-display)", margin: "var(--space-3) 0 var(--space-5)" }}>How can we help?</h1>
          <Input icon="search" placeholder="Search support" />
          <div style={{ marginTop: "var(--space-6)" }}>
            {["Repair or replace", "Track an order", "Set up Halo", "Warranty", "Contact us"].map((t) => (
              <div key={t} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "var(--space-4) 2px", borderBottom: "var(--hairline)" }}>
                <span style={{ font: "var(--text-copy)" }}>{t}</span>
                <Icon name="chevron-right" size={16} color="var(--text-tertiary)" />
              </div>
            ))}
          </div>
        </Section>
      ) : null}
      <Footer />
      {toast ? (
        <div style={{ position: "fixed", bottom: 28, left: 0, right: 0, display: "flex", justifyContent: "center", zIndex: 600 }}>
          <Toast tone="positive" icon="check" message={toast} />
        </div>
      ) : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  ApertureLoad([
    "../../components/core/Icon.jsx",
    "../../components/core/Button.jsx",
    "../../components/core/Badge.jsx",
    "../../components/core/Tag.jsx",
    "../../components/core/Card.jsx",
    "../../components/forms/Input.jsx",
    "../../components/forms/Select.jsx",
    "../../components/forms/Checkbox.jsx",
    "../../components/forms/Radio.jsx",
    "../../components/forms/Switch.jsx",
    "../../components/navigation/Nav.jsx",
    "../../components/navigation/Tabs.jsx",
    "../../components/feedback/Dialog.jsx",
    "../../components/feedback/Toast.jsx",
    "../../components/feedback/Tooltip.jsx",
    "Chrome.jsx",
    "Home.jsx",
    "Product.jsx",
    "Compare.jsx",
    "Bag.jsx"
  ]).then(function () {
    var code = document.getElementById("app").textContent;
    (0, eval)(Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code);
  });
</script>
</body>
</html>
