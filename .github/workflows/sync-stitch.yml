name: Stitch Bidirectional Sync

on:
  push:
    branches: ["main"]
    paths:
      - 'tokens/**'
      - 'DESIGN.md'
  schedule:
    - cron: '0 0 * * *' # Run daily to fetch remote changes
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Synchronization Script
        run: node sync.js 5791869383056614217
        env:
          STITCH_API_TOKEN: ${{ secrets.STITCH_API_TOKEN }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "Stitch Automation"
          git config --global user.email "bot@stitch.example.com"
          git add tokens/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync design tokens with Stitch" && git push)
