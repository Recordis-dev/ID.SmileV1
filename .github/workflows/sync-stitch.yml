name: Stitch Bidirectional Sync

on:
  push:
    branches: ["main"]
    paths:
      - 'tokens/**'
      - 'DESIGN.md'
      - 'components/**'
      - 'ui_kits/**'
  schedule:
    - cron: '0 0 * * *' # Run daily to fetch remote changes
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types:
      - completed
  workflow_dispatch:

jobs:
  sync:
    # Run sync if it was triggered manually, via cron, direct push to tracked paths,
    # OR if it was triggered by a successful deployment run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Synchronization Script
        run: npm run sync
        env:
          STITCH_API_TOKEN: ${{ secrets.STITCH_API_TOKEN }}
          STITCH_PROJECT_ID: 5791869383056614217

      - name: Commit and Push changes
        run: |
          git config --global user.name "Stitch Automation"
          git config --global user.email "bot@stitch.example.com"
          git add tokens/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync design tokens with Stitch" && git push)
